name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  ci:
    name: CI Required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: node --test

  # #46 QA SHOULD: without this, fit.integration.test.mjs's real-sidecar
  # comparison against the ANOVA oracle (Layer 3) never runs -- ANALYSIS_SIDECAR
  # is unset everywhere else in the repo, so the statistical core (CR2/REML
  # via the real Python sidecar) is only checked here, not by the `ci` job
  # above. A green `ci` run means "the code ran", not "the statistics were
  # checked" -- this job is the difference.
  sidecar-verified:
    name: Analysis sidecar (ANALYSIS_SIDECAR=1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Build sidecar venv
        working-directory: evals/analysis/sidecar
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - run: node --test
        env:
          ANALYSIS_SIDECAR: "1"
