# public-safe-lint scoping for ideate-core-evals.
#
# Format and semantics are documented in the comment header of
# public-safe-lint.sh, which is copied here byte-identical from the upstream
# template and must not be edited. All per-repo scoping belongs in this file.
#
# ---------------------------------------------------------------------------
# disable = bare-issue-ref
#
# This is a REASONED EXEMPTION, not a suppressed failure. It is the only rule
# switched off; the other six run unmodified and are clean.
#
# The template scopes this rule narrowly. Its own stated rationale is that a
# bare numeric issue reference "ties public text back to a PRIVATE issue
# tracker with no context" -- the leak is that a reader of the public file
# cannot resolve the reference, and that its existence discloses something
# about a tracker they cannot see.
#
# Neither half of that holds here. This repository is visibility: public with
# has_issues: true. A bare numeric reference in one of its files is a live,
# correctly-resolving link on GitHub for exactly the reader the file is
# published for. The named leak shape is structurally absent, so there is
# nothing for the rule to catch in this tree.
#
# The scale confirms it is a convention rather than an accident. Scanning the
# tree with this rule active reports 1827 hits across 125 files -- source
# comments, test names, docs, arms.config.json, README.md, and the
# explanatory comments inside .gitignore itself. Citing its own issues by
# bare number is simply how this repo writes about itself, and has been since
# long before the lint was adopted.
#
# What was considered and rejected:
#
#   - Rewriting the references to be repo-qualified. Incoherent at this
#     scale, and it buys no safety: the refs already resolve. It would also
#     make the edited files the only place in the tree diverging from the
#     convention every neighbouring file uses.
#
#   - Excluding results-pilot/ instead. That store holds committed, tracked
#     study output (a research record; see .gitignore). But it accounts for 7
#     of the 1827 hits -- under 0.4% -- so an exclusion there would have left
#     roughly 1820 failures standing while looking like compliance. No
#     committed cell body was rewritten, and none should be: editing recorded
#     study output to satisfy a linter corrupts the data the study rests on.
#
# WHAT THIS COSTS: this repo no longer detects bare references to a tracker
# that is not its own -- a bare number pointing at some other project's
# issue. That risk is accepted knowingly. If this repository ever becomes
# private, or starts carrying references to a tracker its readers cannot see,
# this line must be revisited: the argument above depends entirely on the
# repo and its tracker both being public, and it stops being true the moment
# either changes.
# ---------------------------------------------------------------------------

disable = bare-issue-ref
